<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="navbar-brand">HospitalCare+</a>
        <div class="nav-links">
            <a href="index.html" class="active">Dashboard</a>
            <a href="doctors.html">Doctors</a>
            <a href="patients.html">Patients</a>
            <a href="appointments.html">Appointments</a>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1 class="page-title">Dashboard Overview</h1>
        </div>

        <div class="dashboard-grid">
            <div class="dashboard-card">
                <h3>Total Doctors</h3>
                <h2 id="doctors-count">-</h2>
                <a href="doctors.html" class="btn btn-primary">Manage Doctors</a>
            </div>

            <div class="dashboard-card">
                <h3>Total Patients</h3>
                <h2 id="patients-count">-</h2>
                <a href="patients.html" class="btn btn-primary">Manage Patients</a>
            </div>

            <div class="dashboard-card">
                <h3>Total Appointments</h3>
                <h2 id="appointments-count">-</h2>
                <a href="appointments.html" class="btn btn-primary">View Appointments</a>
            </div>
        </div>
    </div>

    <script type="module">
        import { api } from './api.js';

        async function loadDashboard() {
            try {
                const [doctors, patients, appointments] = await Promise.all([
                    api.getDoctors(),
                    api.getPatients(),
                    api.getAppointments()
                ]);

                document.getElementById('doctors-count').textContent = doctors.length;
                document.getElementById('patients-count').textContent = patients.length;
                document.getElementById('appointments-count').textContent = appointments.length;
            } catch (error) {
                console.error("Error loading dashboard data:", error);
            }
        }

        document.addEventListener('DOMContentLoaded', loadDashboard);
    </script>
</body>
</html>
