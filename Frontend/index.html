<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-theme">
    <nav class="navbar">
        <a href="index.html" class="navbar-brand">
            <i class='bx bx-plus-medical'></i> CareSync
        </a>
        <div class="nav-links">
            <a href="index.html" class="active"><i class='bx bx-grid-alt'></i> Dashboard</a>
            <a href="doctors.html"><i class='bx bx-user-voice'></i> Doctors</a>
            <a href="patients.html"><i class='bx bx-user'></i> Patients</a>
            <a href="appointments.html"><i class='bx bx-calendar-event'></i> Appointments</a>
        </div>
        <div class="user-profile">
            <img src="https://ui-avatars.com/api/?name=Admin&background=00e5ff&color=000&bold=true" alt="Admin" class="avatar">
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <div>
                <h1 class="page-title">Dashboard Overview</h1>
                <p class="subtitle">Welcome back! Here's what's happening today.</p>
            </div>
            <a href="appointments.html" class="btn btn-primary"><i class='bx bx-plus'></i> New Appointment</a>
        </div>

        <div class="dashboard-grid">
            <div class="dashboard-card card-blue">
                <div class="card-icon"><i class='bx bx-user-voice'></i></div>
                <div class="card-info">
                    <h3>Total Doctors</h3>
                    <h2 id="doctors-count">-</h2>
                </div>
                <a href="doctors.html" class="card-link">Manage Doctors <i class='bx bx-right-arrow-alt'></i></a>
            </div>

            <div class="dashboard-card card-green">
                <div class="card-icon"><i class='bx bx-user'></i></div>
                <div class="card-info">
                    <h3>Total Patients</h3>
                    <h2 id="patients-count">-</h2>
                </div>
                <a href="patients.html" class="card-link">Manage Patients <i class='bx bx-right-arrow-alt'></i></a>
            </div>

            <div class="dashboard-card card-purple">
                <div class="card-icon"><i class='bx bx-calendar-event'></i></div>
                <div class="card-info">
                    <h3>Appointments</h3>
                    <h2 id="appointments-count">-</h2>
                </div>
                <a href="appointments.html" class="card-link">View Schedule <i class='bx bx-right-arrow-alt'></i></a>
            </div>
        </div>
    </div>

    <script type="module">
        import { api } from './api.js';

        async function loadDashboard() {
            try {
                const [doctors, patients, appointments] = await Promise.all([
                    api.getDoctors(),
                    api.getPatients(),
                    api.getAppointments()
                ]);

                document.getElementById('doctors-count').textContent = doctors.length;
                document.getElementById('patients-count').textContent = patients.length;
                document.getElementById('appointments-count').textContent = appointments.length;
            } catch (error) {
                console.error("Error loading dashboard data:", error);
            }
        }

        document.addEventListener('DOMContentLoaded', loadDashboard);
    </script>
</body>
</html>
