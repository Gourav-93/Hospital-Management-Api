<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctors - Hospital Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="navbar-brand">HospitalCare+</a>
        <div class="nav-links">
            <a href="index.html">Dashboard</a>
            <a href="doctors.html" class="active">Doctors</a>
            <a href="patients.html">Patients</a>
            <a href="appointments.html">Appointments</a>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1 class="page-title">Doctors Directory</h1>
            <button class="btn btn-primary" id="open-add-modal">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                Add Doctor
            </button>
        </div>

        <div class="glass-panel">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Specialization</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th style="text-align: right;">Actions</th>
                    </tr>
                </thead>
                <tbody id="doctors-table-body">
                    <tr><td colspan="5" class="text-center empty-state">Loading doctors...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Add/Edit Doctor Modal -->
    <div class="modal-overlay" id="doctor-modal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title" id="modal-title">Add New Doctor</h2>
                <button class="close-btn" id="close-modal">&times;</button>
            </div>
            <form id="doctor-form">
                <input type="hidden" id="doctor-id">
                <div class="form-group">
                    <label class="form-label">Name</label>
                    <input type="text" id="doctor-name" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Specialization</label>
                    <input type="text" id="doctor-spec" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" id="doctor-email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Phone</label>
                    <input type="text" id="doctor-phone" class="form-control" required>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn" id="cancel-btn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Doctor</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="doctors.js"></script>
</body>
</html>
