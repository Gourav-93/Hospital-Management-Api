<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctors - Hospital Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand">
            <a href="index.html">🏥 HospitalCare</a>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Dashboard</a></li>
            <li><a href="doctors.html" class="active">Doctors</a></li>
            <li><a href="patients.html">Patients</a></li>
            <li><a href="appointments.html">Appointments</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="header-action">
            <h1>Manage Doctors</h1>
        </div>

        <div id="messageBox" class="message"></div>

        <div class="row">
            <div class="col" style="flex: 1;">
                <div class="card">
                    <h2 id="formTitle">Add New Doctor</h2>
                    <form id="doctorForm">
                        <input type="hidden" id="doctorId">
                        <div class="form-group">
                            <label for="name">Name</label>
                            <input type="text" id="name" class="form-control" required placeholder="e.g. Dr. John Smith">
                        </div>
                        <div class="form-group">
                            <label for="specialization">Specialization</label>
                            <input type="text" id="specialization" class="form-control" required placeholder="e.g. Cardiologist">
                        </div>
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" class="form-control" required placeholder="e.g. john.smith@hospital.com">
                        </div>
                        <div class="form-group">
                            <label for="phone">Phone</label>
                            <input type="text" id="phone" class="form-control" required placeholder="e.g. 555-0123">
                        </div>
                        <div style="display: flex; gap: 10px;">
                            <button type="submit" class="btn btn-primary" id="saveBtn">Save Doctor</button>
                            <button type="button" class="btn" style="background: var(--border-color);" id="cancelBtn" onclick="resetForm()">Cancel</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="col" style="flex: 2;">
                <div class="card">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                        <h2>Doctors List</h2>
                        <div style="display: flex; gap: 10px;">
                            <input type="text" id="searchInput" class="form-control" placeholder="Search by name..." style="width: 200px; padding: 0.5rem;">
                            <button class="btn btn-primary btn-sm" onclick="searchDoctors()">Search</button>
                            <button class="btn btn-sm" style="background: var(--border-color);" onclick="fetchDoctors()">Clear</button>
                        </div>
                    </div>
                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Specialization</th>
                                    <th>Email</th>
                                    <th>Phone</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="doctorsTableBody">
                                <!-- Doctors will be loaded here dynamically -->
                                <tr>
                                    <td colspan="6" style="text-align: center;">Loading doctors...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="doctors.js"></script>
</body>
</html>
