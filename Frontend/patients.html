<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patients - Hospital Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand">
            <a href="index.html">🏥 HospitalCare</a>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Dashboard</a></li>
            <li><a href="doctors.html">Doctors</a></li>
            <li><a href="patients.html" class="active">Patients</a></li>
            <li><a href="appointments.html">Appointments</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="header-action">
            <h1>Manage Patients</h1>
        </div>

        <div id="messageBox" class="message"></div>

        <div class="row">
            <div class="col" style="flex: 1;">
                <div class="card">
                    <h2 id="formTitle">Add New Patient</h2>
                    <form id="patientForm">
                        <input type="hidden" id="patientId">
                        <div class="form-group">
                            <label for="name">Name</label>
                            <input type="text" id="name" class="form-control" required placeholder="e.g. Jane Doe">
                        </div>
                        <div class="row">
                            <div class="form-group" style="flex: 1;">
                                <label for="age">Age</label>
                                <input type="number" id="age" class="form-control" required min="0" placeholder="e.g. 35">
                            </div>
                            <div class="form-group" style="flex: 1;">
                                <label for="gender">Gender</label>
                                <select id="gender" class="form-control" required>
                                    <option value="" disabled selected>Select</option>
                                    <option value="Male">Male</option>
                                    <option value="Female">Female</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="disease">Disease / Condition</label>
                            <input type="text" id="disease" class="form-control" required placeholder="e.g. Fever">
                        </div>
                        <div class="form-group">
                            <label for="phone">Phone</label>
                            <input type="text" id="phone" class="form-control" required placeholder="e.g. 555-0987">
                        </div>
                        <div style="display: flex; gap: 10px;">
                            <button type="submit" class="btn btn-primary" id="saveBtn">Save Patient</button>
                            <button type="button" class="btn" style="background: var(--border-color);" id="cancelBtn" onclick="resetForm()">Cancel</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="col" style="flex: 2;">
                <div class="card">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                        <h2>Patients List</h2>
                        <div style="display: flex; gap: 10px;">
                            <input type="text" id="searchInput" class="form-control" placeholder="Search by name..." style="width: 200px; padding: 0.5rem;">
                            <button class="btn btn-primary btn-sm" onclick="searchPatients()">Search</button>
                            <button class="btn btn-sm" style="background: var(--border-color);" onclick="fetchPatients()">Clear</button>
                        </div>
                    </div>
                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Age</th>
                                    <th>Gender</th>
                                    <th>Disease</th>
                                    <th>Phone</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="patientsTableBody">
                                <!-- Patients will be loaded here dynamically -->
                                <tr>
                                    <td colspan="7" style="text-align: center;">Loading patients...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="patients.js"></script>
</body>
</html>
