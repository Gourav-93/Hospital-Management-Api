<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patients - Hospital Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="navbar-brand">HospitalCare+</a>
        <div class="nav-links">
            <a href="index.html">Dashboard</a>
            <a href="doctors.html">Doctors</a>
            <a href="patients.html" class="active">Patients</a>
            <a href="appointments.html">Appointments</a>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1 class="page-title">Patients Directory</h1>
            <button class="btn btn-primary" id="open-add-modal">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                Add Patient
            </button>
        </div>

        <div class="glass-panel">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Age / Gender</th>
                        <th>Disease</th>
                        <th>Phone</th>
                        <th style="text-align: right;">Actions</th>
                    </tr>
                </thead>
                <tbody id="patients-table-body">
                    <tr><td colspan="5" class="text-center empty-state">Loading patients...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Add/Edit Patient Modal -->
    <div class="modal-overlay" id="patient-modal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title" id="modal-title">Add New Patient</h2>
                <button class="close-btn" id="close-modal">&times;</button>
            </div>
            <form id="patient-form">
                <input type="hidden" id="patient-id">
                <div class="form-group">
                    <label class="form-label">Name</label>
                    <input type="text" id="patient-name" class="form-control" required>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label class="form-label">Age</label>
                        <input type="number" id="patient-age" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Gender</label>
                        <select id="patient-gender" class="form-control" required>
                            <option value="">Select...</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Disease / Condition</label>
                    <input type="text" id="patient-disease" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Phone</label>
                    <input type="text" id="patient-phone" class="form-control" required>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn" id="cancel-btn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Patient</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="patients.js"></script>
</body>
</html>
