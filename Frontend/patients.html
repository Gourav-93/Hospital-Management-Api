<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patients - Hospital Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>Hospital Admin</h2>
        </div>
        <ul class="sidebar-menu">
            <li><a href="dashboard.html" id="nav-dashboard">Dashboard</a></li>
            <li><a href="doctors.html" id="nav-doctors">Doctors</a></li>
            <li><a href="patients.html" class="active" id="nav-patients">Patients</a></li>
            <li><a href="appointments.html" id="nav-appointments">Appointments</a></li>
            <li style="margin-top: auto; border-top: 1px solid var(--border-color); padding-top: 10px;">
                <a href="#" id="logout-btn" style="color: var(--warning);">Logout</a>
            </li>
        </ul>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>Manage Patients</h1>
        </div>

        <div class="data-container">
            <div class="toolbar">
                <input type="text" id="searchInput" class="search-box" placeholder="Search patient by name...">
                <button class="btn btn-primary" onclick="openModal()">+ Add Patient</button>
            </div>

            <div id="loader" class="loader">Loading patients...</div>

            <table id="patientsTable" style="display: none;">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Age</th>
                        <th>Gender</th>
                        <th>Disease</th>
                        <th>Phone</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="patientsTableBody">
                    <!-- Data will be populated here -->
                </tbody>
            </table>
            
            <div id="empty-state" class="loader" style="display: none;">No patients found.</div>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div id="patientModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add Patient</h2>
                <span class="close" onclick="closeModal()">&times;</span>
            </div>
            <form id="patientForm">
                <input type="hidden" id="patientId">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-group">
                    <label for="age">Age</label>
                    <input type="number" id="age" required min="0" max="150">
                </div>
                <div class="form-group">
                    <label for="gender">Gender</label>
                    <select id="gender" required>
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="disease">Disease</label>
                    <input type="text" id="disease" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input type="text" id="phone" required>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/patients.js"></script>
</body>
</html>
