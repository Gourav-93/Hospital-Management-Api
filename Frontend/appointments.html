<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointments - Hospital Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand">
            <a href="index.html">🏥 HospitalCare</a>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Dashboard</a></li>
            <li><a href="doctors.html">Doctors</a></li>
            <li><a href="patients.html">Patients</a></li>
            <li><a href="appointments.html" class="active">Appointments</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="header-action">
            <h1>Manage Appointments</h1>
        </div>

        <div id="messageBox" class="message"></div>

        <div class="row">
            <div class="col" style="flex: 1;">
                <div class="card">
                    <h2 id="formTitle">Create Appointment</h2>
                    <form id="appointmentForm">
                        <input type="hidden" id="appointmentId">
                        
                        <div class="form-group">
                            <label for="doctorId">Doctor</label>
                            <select id="doctorId" class="form-control" required>
                                <option value="" disabled selected>Loading doctors...</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="patientId">Patient</label>
                            <select id="patientId" class="form-control" required>
                                <option value="" disabled selected>Loading patients...</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="appointmentDate">Date & Time</label>
                            <input type="datetime-local" id="appointmentDate" class="form-control" required>
                        </div>

                        <div class="form-group">
                            <label for="status">Status</label>
                            <select id="status" class="form-control" required>
                                <option value="Pending">Pending</option>
                                <option value="Confirmed">Confirmed</option>
                                <option value="Completed">Completed</option>
                                <option value="Cancelled">Cancelled</option>
                            </select>
                        </div>

                        <div style="display: flex; gap: 10px;">
                            <button type="submit" class="btn btn-primary" id="saveBtn">Save Appointment</button>
                            <button type="button" class="btn" style="background: var(--border-color);" id="cancelBtn" onclick="resetForm()">Cancel</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="col" style="flex: 2;">
                <div class="card">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                        <h2>Appointments List</h2>
                        <div style="display: flex; gap: 10px;">
                            <select id="statusFilter" class="form-control" style="width: 200px; padding: 0.5rem;" onchange="filterAppointments()">
                                <option value="All">All Statuses</option>
                                <option value="Pending">Pending</option>
                                <option value="Confirmed">Confirmed</option>
                                <option value="Completed">Completed</option>
                                <option value="Cancelled">Cancelled</option>
                            </select>
                        </div>
                    </div>
                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Doctor</th>
                                    <th>Patient</th>
                                    <th>Date</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="appointmentsTableBody">
                                <tr>
                                    <td colspan="6" style="text-align: center;">Loading appointments...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="appointments.js"></script>
</body>
</html>
