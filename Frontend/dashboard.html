<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Hospital Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>Hospital Admin</h2>
        </div>
        <ul class="sidebar-menu">
            <li><a href="dashboard.html" class="active" id="nav-dashboard">Dashboard</a></li>
            <li><a href="doctors.html" id="nav-doctors">Doctors</a></li>
            <li><a href="patients.html" id="nav-patients">Patients</a></li>
            <li><a href="appointments.html" id="nav-appointments">Appointments</a></li>
            <li style="margin-top: auto; border-top: 1px solid var(--border-color); padding-top: 10px;">
                <a href="#" id="logout-btn" style="color: var(--warning);">Logout</a>
            </li>
        </ul>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>Dashboard Overview</h1>
        </div>

        <div id="loader" class="loader">Loading dashboard data...</div>
        <div id="error-message" class="toast error" style="display: none; position: static; margin-bottom: 20px;"></div>

        <div class="dashboard-cards" id="dashboard-cards" style="display: none;">
            <div class="card">
                <h3>Total Doctors</h3>
                <div class="value" id="totalDoctors">0</div>
            </div>
            <div class="card">
                <h3>Total Patients</h3>
                <div class="value" id="totalPatients">0</div>
            </div>
            <div class="card">
                <h3>Total Appointments</h3>
                <div class="value" id="totalAppointments">0</div>
            </div>
            <div class="card" style="border-left: 4px solid #f72585;">
                <h3>Pending Appointments</h3>
                <div class="value" id="pendingAppointments">0</div>
            </div>
            <div class="card" style="border-left: 4px solid #4cc9f0;">
                <h3>Confirmed Appointments</h3>
                <div class="value" id="confirmedAppointments">0</div>
            </div>
            <div class="card" style="border-left: 4px solid #4361ee;">
                <h3>Completed Appointments</h3>
                <div class="value" id="completedAppointments">0</div>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
